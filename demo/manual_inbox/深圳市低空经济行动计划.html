<div class="content"><h1>深圳市低空经济高质量发展行动计划（2026—2028年）</h1>
<p>发布时间：2026年9月10日</p>
<p>为贯彻落实国家关于发展低空经济的决策部署，加快建设低空经济中心，制定本行动计划。</p>
<p>一、总体要求。到2028年，全市低空经济产业规模突破2000亿元，建成低空起降设施1000个以上。</p>
<p>二、飞行管理。在适飞空域内使用微型、轻型无人驾驶航空器飞行的，无需提出飞行计划申请，但应当完成实名登记。</p>
<p>三、空域保障。市交通运输部门统筹低空空域使用需求，会同有关部门编制低空空域使用方案。</p>
